name: elk-vagrant

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.12
    environment:
      discovery.type: single-node
      cluster.name: elk-lab
      node.name: elasticsearch
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 2g
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.12
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    mem_limit: 1536m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - kibana-data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.12
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_ECS_COMPATIBILITY: disabled
      PIPELINE_WORKERS: "1"
    mem_limit: 1g
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./logstash:/usr/share/logstash/pipeline:ro,Z
      - ./.runtime:/logs:ro,Z
      - logstash-data:/usr/share/logstash/data
    restart: unless-stopped

volumes:
  elasticsearch-data:
  kibana-data:
  logstash-data:
