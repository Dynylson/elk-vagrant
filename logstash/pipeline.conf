input {
  file {
    path => "/logs/application.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/application.sincedb"
  }
}

filter {
  grok {
    match => {
      "message" => '^%{TIMESTAMP_ISO8601:log_timestamp} %{IP:client_ip} %{WORD:http_method} %{URIPATHPARAM:route} %{INT:status_code:int} %{INT:response_time_ms:int} "%{DATA:description}"$'
    }
  }
  if "_grokparsefailure" not in [tags] {
    date {
      match => ["log_timestamp", "ISO8601"]
      target => "@timestamp"
    }
    mutate {
      add_field => { "service" => "loja-demo" }
      rename => { "message" => "[event][original]" }
      remove_field => ["log_timestamp", "host", "path", "@version"]
    }
    # Blocos separados garantem a ordem das renomeações.
    mutate {
      rename => { "description" => "message" }
    }
    # Relê o mesmo evento sem criar outro documento no Elasticsearch.
    fingerprint {
      source => ["[event][original]"]
      target => "[@metadata][document_id]"
      method => "SHA256"
    }
  }
}

output {
  if "_grokparsefailure" not in [tags] and "_dateparsefailure" not in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "elk-lab-logs"
      document_id => "%{[@metadata][document_id]}"
      manage_template => false
      ilm_enabled => false
    }
  } else {
    stdout { codec => rubydebug }
  }
}
